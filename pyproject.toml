[project]
name = "ripperr"
version = "0.1.0"
description = "Podcast feeds, transcripts and speaker identity; models run in ripperr-worker"
requires-python = ">=3.11"

dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "jellyfish>=1.0",  # metaphone keys for player-name matching
]

[project.optional-dependencies]
server = []
youtube = [
    "yt-dlp[default]",  # [default] pulls yt-dlp-ejs, the YouTube JS challenge solver
    "deno",  # JS runtime yt-dlp needs for YouTube; PyPI redistribution of the Deno binary
]

[project.scripts]
ripperr = "ripperr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ripperr"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "ripperr"
version = "0.1.0"
description = "Apple Silicon native podcast download, transcription and diarization"
requires-python = ">=3.11"

dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "jellyfish>=1.0",  # metaphone keys for player-name matching
    # mlx-whisper is macOS/Apple Silicon only; kept optional so the package can
    # at least be imported elsewhere for testing the merge logic.
]

[project.optional-dependencies]
server = []
youtube = [
    "yt-dlp[default]",  # [default] pulls yt-dlp-ejs, the YouTube JS challenge solver
    "deno",  # JS runtime yt-dlp needs for YouTube; PyPI redistribution of the Deno binary
]
apple = [
    "mlx-whisper>=0.4",
    # Senko is on PyPI (0.1.0), but its output shape has changed between versions
    # (see diarize.normalize_segments), so pin the exact commit that was tested
    # for reproducibility. To upgrade: bump the SHA (or switch to a release pin),
    # run a real episode, then run the tests. Senko needs Python < 3.14.
    "senko @ git+https://github.com/narcotic-sh/senko.git@1bcb09041bfa170b4a5a4b0af92f66eff76204d5",
]

[project.scripts]
ripperr = "ripperr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # for the pinned Senko commit

[tool.hatch.build.targets.wheel]
packages = ["ripperr"]

[tool.pytest.ini_options]
pythonpath = ["."]
